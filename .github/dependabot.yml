version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-tooling:
        dependency-type: development
        patterns: ["*"]
    ignore:
      # typescript-eslint 8 supports only TypeScript < 6.1. See docs/architecture/ADR-015.md.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
