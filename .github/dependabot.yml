version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-tooling:
        dependency-type: development
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
