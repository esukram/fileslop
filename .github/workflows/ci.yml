name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Pack and run the CLI like npx users do
        run: |
          pnpm --filter fileslop pack --out "$RUNNER_TEMP/fileslop.tgz"
          npx -y --package="$RUNNER_TEMP/fileslop.tgz" fileslop --version
      - name: Fail on committed Fileslop tokens
        run: |
          if git grep -nE 'es\.fs1\.key\.[A-Za-z0-9_-]{43}'; then
            echo "::error::A Fileslop token is in the repository. Revoke it and remove it."
            exit 1
          fi
      - name: Build and run the server container image
        if: matrix.node == 26
        run: |
          docker build -t fileslop-server:ci server
          docker run --rm fileslop-server:ci help
